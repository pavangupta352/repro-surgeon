name: Bug report
description: A reduction, verification, or execution behavior that is incorrect
body:
  - type: markdown
    attributes:
      value: Review attachments for private source and credentials. Report security vulnerabilities using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Runtime and tool versions
      description: Repro Surgeon, Node, npm, operating system and architecture.
    validations:
      required: true
  - type: textarea
    id: predicate
    attributes:
      label: Command and failure check
      description: Share the argv command, exact exit code, required fragments, and forbidden fragments. Redact private text.
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Small reproduction and steps
      description: Link licensed source you can share, or describe a small independent case. Do not attach the entire private run directory.
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Verification result, stop reason, and selected redacted logs.
