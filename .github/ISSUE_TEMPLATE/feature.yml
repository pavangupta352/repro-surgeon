name: Feature request
description: Describe a concrete reproduction workflow the tool cannot handle
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to reproduce?
      description: Describe your project, command and the blocker.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful result look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you tried
